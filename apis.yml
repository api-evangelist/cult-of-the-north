name: Cult of the North
description: Cult of the North (established November 2022 under the codename "Seidr")
  is a Stockholm, Sweden-based video game studio co-founded by former EA general manager
  Adam Schaub and former King SVP Marcus Jacobs, and backed by a seed investment from
  Andreessen Horowitz (a16z). The studio drew talent from King, Activision Blizzard, EA,
  Embark Studios, Resolution Games, and FunPlus, and set out to build large-scale, next-generation
  multiplayer PvP experiences for PC and console in Unreal Engine 5 — first the debut title
  codenamed "Project Gundalf" and later the free-to-play strategy war game "We Will Be Gods."
  As a consumer game studio it exposes no public developer API, SDK, or documentation surface;
  this profile carries company identity only. Industry reporting in 2025 indicated the studio
  wound down operations.
